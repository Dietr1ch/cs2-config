
echo "Loading mouse-razer_naga (~/Projects/cs2-config/autoexec/3-mouse-razer_naga.cfg)"


// Mouse - Weapons
bind "F1" "slot2; slot1; cl_crosshair_recoil true; vote option1"
bind "F2" "slot2;        cl_crosshair_recoil false; vote option2"
bind "F4" "+lookatweapon"
// Mouse - Grenades
bind "F3" "slot7"   // Flash
bind "F6" "slot6"   // HE
bind "F9" "slot10"  // Molly/Incendiary
bind "F12" "slot8; demo_togglepause"  // Smoke
bind "F10" "sellbackall; demo_timescale 0.5"  // Sell         | Time x0.5
bind "F11" "switchhands; demo_timescale 1"    // Switch Hands | Time x1.0
// Mouse - Misc
bind "F5" "noclip"                                 // Fly (noclip)
bind "F7" "sv_rethrow_last_grenade; demo_gototick -600"                // Rethrow grenade | Time -10s
bind "F8" "ent_fire smokegrenade_projectile kill; demo_gototick +600"  // Clear smoke     | Time +10s
