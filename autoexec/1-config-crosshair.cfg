echo "Loading config-crosshair (~/Projects/cs2-config/autoexec/1-config-crosshair)"


alias "+pew" "+attack; cl_crosshair_recoil true;"
alias "-pew" "-attack; cl_crosshair_recoil false;"



// Crosshair

// Crosshair - Style
cl_crosshairdot true
cl_crosshair_t false

// Crosshair - Size
cl_crosshairsize 2
cl_crosshairthickness 0.5
cl_crosshairgap 0

// Crosshair - Outline
cl_crosshair_drawoutline true
cl_crosshair_outlinethickness 1

// Crosshair - Color
cl_crosshaircolor 5
cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 0
cl_crosshairalpha 200

// Crosshair - Sniper (AWP/Scout/G3SG1/SCAR-20)
cl_sniper_delay_unscope false
cl_sniper_show_inaccuracy true
cl_crosshair_sniper_width 1

// Crosshair - Ironsight (SG553/AUG)
cl_ironsight_dot_scale 1
cl_ironsight_usecrosshaircolor false

// Crosshair - Spectating
cl_show_observer_crosshair 2  // 0: No, 1: Friends&Party, 2: Everyone

// Crosshair - Misc
cl_crosshairgap_useweaponvalue false  // Deployed weapon gap
cl_crosshair_friendly_warning 0       // Friendly warning




cl_grenadecrosshair_keepusercrosshair false

cl_grenadecrosshair_flash     true
cl_grenadecrosshair_explosive true
cl_grenadecrosshair_fire      true
cl_grenadecrosshair_smoke     true
cl_grenadecrosshair_decoy     true

cl_grenadecrosshairdelay_flash     0.0
cl_grenadecrosshairdelay_explosive 0.0
cl_grenadecrosshairdelay_fire      0.0
cl_grenadecrosshairdelay_smoke     0.0
cl_grenadecrosshairdelay_decoy     0.0

